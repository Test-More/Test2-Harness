[Prereqs / DevelopRequires]
; Author/release prereqs and CI-only modules. Anything that used to live
; in .github/cpanfile.ci has been folded in here so CI can install
; everything from a single cpanfile (with --with-develop). Also includes
; optional backends that gate test coverage in t/AI/unit/LogArchive/
; and t/AI/unit/Command/archive_extract.t -- without these the affected
; subtests are skipped.
Class::XSAccessor                       = 1.19
DBD::MariaDB                            = 0
DBD::Pg                                 = 0
DBD::SQLite                             = 0
; DBD::mysql 5.x dropped support for MariaDB's client library and
; references MySQL 8 client constants (MYSQL_OPT_COMPRESSION_ALGORITHMS,
; SSL_MODE_*, MYSQL_OPT_SSL_MODE, ...) that don't exist in MariaDB
; headers. The perldocker/perl-tester:* CI images ship MariaDB only,
; so we pin to <5.0 (4.052 is the last MariaDB-compatible release) to
; let DBD::mysql build cleanly against the headers already present.
DBD::mysql                              = <5.0
DBIx::Class::Schema::Loader             = 0
DBIx::Class::Storage::DBI::MariaDB      = 0
DateTime::Format::MySQL                 = 0
DateTime::Format::Pg                    = 0
DateTime::Format::SQLite                = 0
Devel::AssertOS                         = 0
File::Copy                              = 0
HTTP::Tiny                              = 0
Linux::Inotify2                         = 0
Module::Install                         = 1.21
Module::Pluggable                       = 5.2
Plack::Middleware::DBIx::DisconnectAll  = 0
System::Info                            = 0.064
Term::ANSIColor                         = 4.06
Term::ReadLine                          = 0
Test::More                              = 1.302199
Test::Pod                               = 1.41
Test::Spelling                          = 0.12   ; for xt/author/pod-spell.t
XML::Simple                             = 0

