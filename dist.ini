[RewriteVersion] ; sets dist version from main module's $VERSION
[License]
[ManifestSkip]
[Manifest]
[NextRelease]
[GatherFile]
filename = .yath.rc

; Gather .yath.v2.rc explicitly so the build dir carries the versioned
; config name. Without this, .yath.rc (a symlink at repo root) is copied
; as a plain file and App::Yath::Script::find_rc_updir defaults to V1,
; crashing test.pl which expects V2 (our local App::Yath::Script::V2).
[GatherFile / GatherYathV2Rc]
filename = .yath.v2.rc

[GatherDir]
exclude_match = ^tt                 ; only run these tests locally
exclude_match = ^xt/downstream      ; only run these tests locally
exclude_match = ^pt                 ; only run these tests locally
exclude_match = ^author/
exclude_match = ^author_tools
exclude_match = ^cover
exclude_match = ^demo
exclude_match = ^nyt
exclude_match = ^reference/
exclude_match = ^release-scripts
exclude_match = ^t/
exclude_match = ^test-logs
exclude_match = ^deplib/
exclude_match = ^Test2-Harness2-\d   ; skip leftover build dirs/tarballs from prior dzil runs
exclude_match = ^App-Yath-Script-\d  ; skip leftover extracted CPAN dist of App::Yath::Script
exclude_filename = .yath-persist.json
exclude_filename = LICENSE
exclude_filename = Makefile
exclude_filename = Makefile.PL
exclude_filename = README
exclude_filename = README.md
exclude_filename = cpanfile

[Git::GatherDir / GatherDotFilesT]
root = t/
prefix = t/
include_dotfiles = 1

[Run::BeforeBuild / AssertZstdDict]
run = perl -e 'die "missing share/other/zstd.dict (run author/train_zstd_dict to regenerate)\n" unless -f q{share/other/zstd.dict} && -s _ > 100'

[Run::AfterBuild]
run = perl -Ilib release-scripts/generate_command_pod.pl %d
run = perl -Ilib release-scripts/generate_options_pod.pl %d

[ExecDir]
dir = scripts

[ShareDir]
dir = share

[PodSyntaxTests]
[TestRelease]

[MetaResources]
bugtracker.web  = https://github.com/Test-More/Test2-Harness/issues
repository.url  = https://github.com/Test-More/Test2-Harness/
repository.type = git

