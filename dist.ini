name    = Test2-Harness2
author  = Chad Granum <exodist@cpan.org>
license = Perl_5
copyright_holder = Chad Granum

[RewriteVersion] ; sets dist version from main module's $VERSION
[License]
[ManifestSkip]
[Manifest]
[NextRelease]

[GatherDir]
exclude_match = ^reference/         ; immutable historical iterations
exclude_match = ^worktrees/         ; local development worktrees
exclude_match = ^branches/          ; local scratch
exclude_match = ^docs/              ; internal design docs / plans
exclude_match = ^AI_DOCS/           ; internal AI task docs
exclude_match = ^agent_scripts/     ; agent-only tooling, not shipped
exclude_match = ^Test2-Harness2-\d  ; leftover build dirs/tarballs from prior dzil runs
exclude_filename = LICENSE
exclude_filename = Makefile
exclude_filename = Makefile.PL
exclude_filename = README
exclude_filename = README.md
exclude_filename = cpanfile

[PruneCruft]

[ShareDir]
dir = share

[PodSyntaxTests]
[TestRelease]

[MetaResources]
bugtracker.web  = https://github.com/Test-More/Test2-Harness/issues
repository.url  = https://github.com/Test-More/Test2-Harness/
repository.type = git

; Hard requirements: everything the shipped harness loads unconditionally.
; Non-default database drivers are NOT here -- they are loaded on demand and
; live under RuntimeRecommends.
[Prereqs]
perl                = 5.038000
parent              = 0.241
constant            = 0
Carp                = 0
Errno               = 0
Fcntl               = 0
POSIX               = 0
Scalar::Util        = 0
Time::HiRes         = 0
IO::Handle          = 1.27
IO::Select          = 0
Importer            = 0.025
Object::HashBase    = 0.016
Role::Tiny          = 1.003000
Scope::Guard        = 0
Atomic::Pipe        = 0.026
Compress::Zstd      = 0.20
Cpanel::JSON::XS    = 4.38
DBI                 = 0
DBD::SQLite         = 0            ; default backend
DBIx::QuickORM      = 0.000021     ; row layer (autofill schema + autotypes); 0.000021 picks up generated columns via PRAGMA table_xinfo
Test2::API          = 1.302199
Test2::Formatter    = 1.302199
Test2::Util::UUID   = 0.002008     ; v7 UUIDs, generated in Perl

[Prereqs / TestRequires]
Test2::V0           = 0.000163
DBI                 = 0
DBD::SQLite         = 0
DBIx::QuickDB       = 0            ; ephemeral test databases

; Non-default database flavors are driver-loaded only when the caller points
; the harness at a matching DSN, so their DBD::* modules are recommended, not
; required.
[Prereqs / RuntimeRecommends]
DBD::Pg             = 0
DBD::mysql          = 0
DBD::MariaDB        = 0
DBIx::QuickDB       = 0            ; spinning up non-default flavors on the fly

[MakeMaker::Awesome]
:version = 0.26
test_file = t/*.t
